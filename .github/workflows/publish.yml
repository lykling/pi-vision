# Publishes to npm via OIDC trusted publishing — no tokens involved.
# Requires a Trusted Publisher entry on npmjs.com matching exactly:
#   Organization or user: lykling
#   Repository:           pi-vision
#   Workflow filename:    publish.yml
#   Environment name:     (leave empty)
#   Allowed actions:      npm publish (direct publish must be checked)
name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public
